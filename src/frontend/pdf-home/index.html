<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF文件管理 - Anki LinkMaster</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 新增：Flex顶层容器，实现容器隔离 -->
    <div class="app-root">
        <!-- 顶部工具栏：窗口控制按钮 -->
        <header class="pdf-home-header">
            <h1 class="pdf-home-title">📚 Anki LinkMaster - PDF 管理</h1>
            <div class="toolbar-controls">
                <!-- 窗口控制按钮容器（由WindowControlsComponent动态挂载）-->
            </div>
        </header>

        <main class="pdf-home-main">
            <!-- 左侧侧边栏 -->
            <aside id="sidebar" class="sidebar">
                <!-- 侧边栏内容将由JavaScript动态生成 -->
            </aside>

            <!-- 右侧主内容区 -->
            <div class="main-content">
                <div class="search-results-header">
                    <h2>📚 搜索结果</h2>
                    <span class="result-count-badge">共 0 条</span>
                </div>

                <div id="pdf-table-container" class="pdf-table-container">
                    <!-- 搜索结果将在这里动态生成 -->
                </div>
            </div>

            <!-- Toast消息提示 (浮动在右上角) -->
            <div id="global-success" class="toast toast-success">
                <!-- 成功消息将在这里显示 -->
            </div>
            <div id="global-error" class="toast toast-error">
                <!-- 错误消息将在这里显示 -->
            </div>

            <!-- 调试状态显示 -->
            <div id="debug-status" style="display: none; background: #f0f0f0; border: 1px solid #ccc; border-radius: 4px; padding: 10px; margin-top: 15px; font-family: monospace; font-size: 12px;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                    <strong>🔍 调试状态</strong>
                    <button onclick="document.getElementById('debug-status').style.display='none'" style="background: #f44; color: white; border: none; padding: 2px 6px; border-radius: 3px; cursor: pointer;">隐藏</button>
                </div>
                <div id="debug-content">
                    <!-- 调试信息将在这里显示 -->
                </div>
            </div>
        </main>
    </div>
    <!-- QWebChannel支持 -->
    <script src="/js/qwebchannel.js"></script>
    <!-- 固定 iziToast 根容器，避免 target 为空导致的样式访问异常 -->
    <div id="izi-toast-root" style="position:fixed;top:16px;right:16px;z-index:2147483647;pointer-events:none;display:flex;flex-direction:column;gap:8px"></div>
    <script>
      try {
        console.info('[BOOT] index.html mounted');
      } catch(e) { }
    </script>
    <script type="module">
      console.info('[BOOT] module loader start');
      // 全局错误捕获，避免沉默失败
      window.addEventListener('error', (ev) => {
        try {
          const msg = ev?.message;
          const file = ev?.filename;
          const line = ev?.lineno;
          const stack = ev?.error?.stack || '(no stack)';
          console.error('[GLOBAL-ERROR]', msg, file, line);
          console.error('[GLOBAL-ERROR-STACK]', stack);
        } catch(e) {}
      });
      window.addEventListener('unhandledrejection', (ev) => {
        try {
          const reason = ev?.reason;
          const msg = reason && (reason.message || String(reason));
          const stack = reason && reason.stack;
          console.error('[UNHANDLED-REJECTION]', msg);
          if (stack) console.error('[UNHANDLED-STACK]', stack);
        } catch(e) {}
      });
      import('./index.js')
        .then(() => {
          console.info('[BOOT] imported index.js');
        })
        .catch((err) => {
          console.error('[BOOT] import index.js failed', err);
          try {
            const msg = '启动失败: ' + (err && err.message ? err.message : String(err));
            const el = document.getElementById('global-error');
            if (el) {
              el.textContent = msg;
              el.style.display = 'block';
              setTimeout(() => {
                try { el.style.display = 'none'; } catch (_) {}
              }, 8000);
            }
          } catch(e) {}
        });
    </script>
</body>
</html>
