<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF阅读器 - Anki LinkMaster</title>
    <link rel="stylesheet" href="assets/style.css">
    <link rel="stylesheet" href="features/infra-sidebar/styles/sidebar-layout.css">
    <!-- 早期全局错误 → toast 模块（在应用代码之前加载） -->
    <script type="module" src="assets/global-error-toast.js"></script>
    <!-- PDF.js CSS is loaded via JavaScript import in main.js (line 8) -->
</head>
<body>
    <div class="container">
        <header>
            <div class="header-left">
                <button id="copy-pdf-id-btn" class="btn copy-id-btn" title="复制 PDF ID" style="display: none;">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                        <rect x="4" y="4" width="8" height="10" stroke="currentColor" stroke-width="1.5" fill="none" rx="1"/>
                        <path d="M6 4 L6 2 C6 1.5 6.5 1 7 1 L13 1 C13.5 1 14 1.5 14 2 L14 11 C14 11.5 13.5 12 13 12 L12 12" stroke="currentColor" stroke-width="1.5" fill="none"/>
                    </svg>
                </button>
                <h1 id="pdf-title">PDF阅读器-D</h1>
            </div>
            <div class="header-right toolbar-right">
                <!-- 搜索按钮（提升到外层，确保SearchBox组件能找到）-->
                <button id="search-toggle-btn" class="btn" title="搜索 (Ctrl+F)">🔍 搜索</button>

                <!-- 侧边栏按钮容器：书签、标注、卡片、翻译等 -->
                <div id="pdf-viewer-button-container" class="sidebar-buttons">
                    <!-- 其他侧边栏按钮将在这里动态生成 -->
                </div>

                <!-- 窗口控制按钮容器（由WindowControlsComponent动态挂载）-->
                <!-- 不要在这里硬编码按钮HTML，组件会自动创建 -->
            </div>
        </header>

        <main>
            <div id="viewerContainer" class="pdf-container">
                <div id="viewer" class="pdfViewer"></div>
            </div>

            <div id="loading" class="loading" style="display: none;">
                <div class="spinner"></div>
                <p>正在加载PDF...</p>
            </div>

            <div id="error" class="error" style="display: none;">
                <p>无法加载PDF文件</p>
            </div>
        </main>
    </div>

    <!-- 浮动控制面板（右下角） -->
    <div id="floating-controls" class="floating-controls">
        <button id="controls-toggle-btn" class="controls-toggle-btn" title="收起/展开控制面板">收起</button>
        <div id="controls-content" class="controls-content">
            <div class="main-controls">
                <div class="layout-controls">
                    <!-- 鼠标模式切换按钮 -->
                    <div class="mouse-mode-selector">
                        <button id="mouse-mode-btn" class="btn" type="button" title="鼠标模式：文本选择">
                            <!-- 默认显示文本选择图标 -->
                            <svg class="mouse-icon" width="18" height="18" viewBox="0 0 18 18" fill="none">
                                <!-- 文本选择图标：I字形光标 + 文本线条 -->
                                <path d="M6 3 L6 4 L8 4 L8 14 L6 14 L6 15 L12 15 L12 14 L10 14 L10 4 L12 4 L12 3 Z" stroke="currentColor" stroke-width="1.5" fill="none"/>
                                <line x1="4" y1="8" x2="14" y2="8" stroke="currentColor" stroke-width="1" opacity="0.5"/>
                                <line x1="4" y1="11" x2="14" y2="11" stroke="currentColor" stroke-width="1" opacity="0.5"/>
                            </svg>
                        </button>
                    </div>
                    <!-- 隐藏的select，保持兼容性 -->
                    <select id="scroll-mode" style="display:none;">
                        <option value="0">垂直滚动</option>
                        <option value="1">水平滚动</option>
                        <option value="3">单页</option>
                    </select>
                    <!-- 自定义SVG滚动模式选择器 -->
                    <div class="scroll-mode-selector">
                        <button id="scroll-mode-btn" class="btn" type="button" title="滚动模式">
                            <!-- 默认显示垂直滚动图标 -->
                            <svg class="scroll-icon" width="18" height="18" viewBox="0 0 18 18" fill="none">
                                <rect x="4" y="1" width="10" height="4" stroke="currentColor" stroke-width="1.5"/>
                                <rect x="4" y="7" width="10" height="4" stroke="currentColor" stroke-width="1.5"/>
                                <rect x="4" y="13" width="10" height="4" stroke="currentColor" stroke-width="1.5"/>
                            </svg>
                        </button>
                        <div class="scroll-mode-dropdown" style="display:none;">
                            <button type="button" data-value="0" title="垂直滚动">
                                <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
                                    <rect x="4" y="1" width="10" height="4" stroke="currentColor" stroke-width="1.5"/>
                                    <rect x="4" y="7" width="10" height="4" stroke="currentColor" stroke-width="1.5"/>
                                    <rect x="4" y="13" width="10" height="4" stroke="currentColor" stroke-width="1.5"/>
                                </svg>
                            </button>
                            <button type="button" data-value="1" title="水平滚动">
                                <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
                                    <rect x="1" y="4" width="4" height="10" stroke="currentColor" stroke-width="1.5"/>
                                    <rect x="7" y="4" width="4" height="10" stroke="currentColor" stroke-width="1.5"/>
                                    <rect x="13" y="4" width="4" height="10" stroke="currentColor" stroke-width="1.5"/>
                                </svg>
                            </button>
                            <button type="button" data-value="3" title="单页">
                                <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
                                    <rect x="3" y="1" width="12" height="16" stroke="currentColor" stroke-width="1.5"/>
                                </svg>
                            </button>
                        </div>
                    </div>
                    <!-- 隐藏的select，保持兼容性 -->
                    <select id="spread-mode" style="display:none;">
                        <option value="0">单页</option>
                        <option value="2">双页</option>
                    </select>
                    <!-- 自定义SVG跨页模式选择器 -->
                    <div class="spread-mode-selector">
                        <button id="spread-mode-btn" class="btn" type="button" title="跨页模式">
                            <!-- 默认显示单页图标 -->
                            <svg class="spread-icon" width="18" height="18" viewBox="0 0 18 18" fill="none">
                                <rect x="5" y="2" width="8" height="14" stroke="currentColor" stroke-width="1.5"/>
                            </svg>
                        </button>
                        <div class="spread-mode-dropdown" style="display:none;">
                            <button type="button" data-value="0" title="单页">
                                <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
                                    <rect x="5" y="2" width="8" height="14" stroke="currentColor" stroke-width="1.5"/>
                                </svg>
                            </button>
                            <button type="button" data-value="2" title="双页">
                                <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
                                    <rect x="1" y="2" width="7" height="14" stroke="currentColor" stroke-width="1.5"/>
                                    <rect x="10" y="2" width="7" height="14" stroke="currentColor" stroke-width="1.5"/>
                                </svg>
                            </button>
                        </div>
                    </div>
                </div>
                <div class="rotation-controls">
                    <button id="rotate-ccw" class="btn" title="逆时针旋转">↺</button>
                    <button id="rotate-cw" class="btn" title="顺时针旋转">↻</button>
                </div>
                <div class="page-controls">
                    <button id="prev-page" class="btn">←</button>
                    <input type="number" id="page-input" class="page-input" min="1" value="1" />
                    <span id="page-total">/ 1</span>
                    <button id="next-page" class="btn">→</button>
                </div>
                <div class="zoom-controls">
                    <button id="zoom-out" class="btn">-</button>
                    <span id="zoom-level">100%</span>
                    <button id="zoom-in" class="btn">+</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="assets/floating-controls.js"></script>
    <script type="module" src="main.js"></script>
</body>
</html>
