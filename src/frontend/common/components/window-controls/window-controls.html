<!-- 自定义窗口控制按钮组件 -->
<div class="window-controls">
    <button id="window-drag-btn" class="window-control-btn window-drag" title="拖拽移动窗口">
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
            <circle cx="3" cy="3" r="1" fill="currentColor"/>
            <circle cx="6" cy="3" r="1" fill="currentColor"/>
            <circle cx="9" cy="3" r="1" fill="currentColor"/>
            <circle cx="3" cy="6" r="1" fill="currentColor"/>
            <circle cx="6" cy="6" r="1" fill="currentColor"/>
            <circle cx="9" cy="6" r="1" fill="currentColor"/>
            <circle cx="3" cy="9" r="1" fill="currentColor"/>
            <circle cx="6" cy="9" r="1" fill="currentColor"/>
            <circle cx="9" cy="9" r="1" fill="currentColor"/>
        </svg>
    </button>
    <button id="window-minimize-btn" class="window-control-btn window-minimize" title="最小化">
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
            <line x1="2" y1="6" x2="10" y2="6" stroke="currentColor" stroke-width="1.5"/>
        </svg>
    </button>
    <button id="window-maximize-btn" class="window-control-btn window-maximize" title="最大化/还原">
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
            <rect x="2" y="2" width="8" height="8" stroke="currentColor" stroke-width="1.5" fill="none"/>
        </svg>
    </button>
    <button id="window-close-btn" class="window-control-btn window-close" title="关闭">
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
            <path d="M3 3 L9 9 M9 3 L3 9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
    </button>
</div>
